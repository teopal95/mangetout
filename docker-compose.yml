services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mangetoutdb
      SPRING_DATASOURCE_USERNAME: mangetout
      SPRING_DATASOURCE_PASSWORD: mangetout
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mangetoutdb
      POSTGRES_USER: mangetout
      POSTGRES_PASSWORD: mangetout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangetout -d mangetoutdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
