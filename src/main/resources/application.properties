spring.application.name=mangetout

# H2 in-memory database (dev)
spring.datasource.url=jdbc:h2:mem:mangetoutdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT — replace secret with a real 256-bit Base64 key before deploying
jwt.secret=bWFuZ2V0b3V0LXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC0yNTZiaXQ=
jwt.expiration=86400000
