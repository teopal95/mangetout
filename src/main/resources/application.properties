# ============================================================
# Mangetout — Application Configuration (Development)
# ============================================================

spring.application.name=mangetout

# ------------------------------------------------------------
# DATABASE (MongoDB — local dev instance)
# ------------------------------------------------------------
# Connect to a local MongoDB running on the default port.
# Run with: docker run -d -p 27017:27017 mongo:7
# Or install MongoDB locally. Data persists between restarts.
spring.data.mongodb.uri=mongodb://localhost:27017/mangetoutdb

# ------------------------------------------------------------
# SERVER
# ------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------
# JWT (JSON Web Tokens — our login ticket system)
# ------------------------------------------------------------
jwt.secret=bWFuZ2V0b3V0LXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC0yNTZiaXQ=
# 86400000 ms = 24 hours
jwt.expiration=86400000

# ------------------------------------------------------------
# FILE UPLOADS
# ------------------------------------------------------------
app.upload.dir=uploads
app.base-url=http://localhost:8080

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
